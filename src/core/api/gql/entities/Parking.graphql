query ParkingInfo {
  parkingInfo {
    name
    server_uuid
    clients_count
    license
    uhf
    csn
    plate_recognition
  }
}

mutation UpdateParkingLicense($body: UpdateParkingLicenseRq!) {
  updateParkingLicense(body: $body)
}

mutation UpdateParkingInfo($body: UpdateParkingInfoRq!){
  updateParkingInfo(body: $body)
}